name: Actualizar clave de Algolia para el buscador

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener clave efímera de Fragrantica
        id: clave
        run: |
          HTML=$(curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" "https://www.fragrantica.es/buscar/?query=perfume")
          echo "bytes: ${#HTML}"
          TITLE=$(echo "$HTML" | grep -oP '<title>\K[^<]+' | head -1)
          echo "título: $TITLE"
          B64=$(echo "$HTML" | grep -oP 'let toAbby = "\K[^"]+')
          if [ -z "$B64" ]; then
            echo "clave_extraida=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          APPID=$(echo "$HTML" | grep -oP '"algoliaAppId":"\K[A-Z0-9]+' | head -1)
          # Comprobar que la clave funciona antes de publicarla
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://${APPID}-dsn.algolia.net/1/indexes/fragrantica_perfumes/query" \
            -H "X-Algolia-Application-Id: ${APPID}" \
            -H "X-Algolia-API-Key: ${B64}" \
            -H "Content-Type: application/json" \
            --data-binary '{"query":"test","hitsPerPage":1}')
          echo "algolia_http: $CODE"
          if [ "$CODE" != "200" ]; then
            echo "clave_extraida=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p api-data
          printf '{\n  "appId": "%s",\n  "apiKey": "%s",\n  "generadoEn": "%s"\n}\n' \
            "$APPID" "$B64" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > api-data/algolia-key.json
          echo "clave_extraida=true" >> "$GITHUB_OUTPUT"

      - name: Publicar en la rama api-data
        if: steps.clave.outputs.clave_extraida == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin api-data 2>/dev/null || git checkout --orphan api-data
          git checkout api-data 2>/dev/null || true
          git reset --hard origin/api-data 2>/dev/null || true
          cp api-data/algolia-key.json .
          git add algolia-key.json
          git diff --cached --quiet && echo "sin cambios" || git commit -m "clave Algolia [skip ci]"
          git push origin api-data
