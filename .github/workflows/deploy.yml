name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Generar js/config.js desde el secreto GROQ_API_KEY
        run: |
          printf '// Generado en el despliegue desde GitHub Secrets.\nwindow.GROQ_API_KEY = "%s";\n' "${{ secrets.GROQ_API_KEY }}" > js/config.js

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
